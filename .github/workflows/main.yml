name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Foundry module
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Build Foundry module archive
        run: |
          zip -r npc-chatter.zip \
            CHANGELOG.md \
            LICENSE.md \
            README.md \
            module.json \
            npcchatter.js \
            chattertablesetup.PNG \
            npc-chatter.gif \
            packs/npc-chatter

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            npc-chatter.zip \
            module.json \
            --verify-tag \
            --title "NPC Chatter $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
